    <!-- SEO:END -->

    <!--
      Resolve the theme before first paint.

      Without this the page paints with the default dark tokens and then snaps to
      the stored preference once React mounts. Inline and synchronous is the only
      way to beat that flash.

      It runs *after* the generated block above because it also corrects the single
      `theme-color` meta, which the block emits. One meta, updated imperatively,
      rather than two with media queries: ThemeProvider needs to override the
      browser chrome colour when the visitor picks a theme that disagrees with the
      OS, and a `media` attribute would win against that.

      The two hex values are duplicated from src/config/site.config.json because an
      inline script cannot import JSON. `npm run seo` fails the build if they drift
      apart, so the duplication cannot go stale silently.
    -->
    <script>
      ;(function () {
        var DARK = '#05070e'
        var LIGHT = '#f6f7fb'
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? LIGHT : DARK)
        } catch (e) {
          /* Private mode / blocked storage: keep the dark default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
